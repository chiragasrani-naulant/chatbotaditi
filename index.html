<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ask Chirag about you</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f6; --panel:#ffffff; --ink:#1f1d1b; --muted:#7a746d; --line:#e8e4de; --hover:#f3f0ea; --bubble:#efebe4; --accent:#e0556b;
  --serif:"Newsreader",Georgia,serif; --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171615;--panel:#201f1d;--ink:#f2efea;--muted:#9a948b;--line:#33312e;--hover:#2a2826;--bubble:#2c2a27;--accent:#ff7d92}}
:root[data-theme="dark"]{--bg:#171615;--panel:#201f1d;--ink:#f2efea;--muted:#9a948b;--line:#33312e;--hover:#2a2826;--bubble:#2c2a27;--accent:#ff7d92}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:0 18px;position:relative}
.top{height:56px;display:flex;align-items:center;justify-content:space-between;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:500;font-size:.95rem}
.mark{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.mark svg{width:14px;height:14px;fill:currentColor;animation:beat 2.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#reset{font:inherit;font-size:.85rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:7px 14px;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .3s,background .2s,border-color .2s,transform .2s}
#reset.on{opacity:1;pointer-events:auto}#reset:hover{background:var(--hover);border-color:var(--accent);transform:translateX(-2px)}#reset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* home */
#home{flex:1;display:flex;flex-direction:column;justify-content:flex-start;align-items:center;text-align:center;padding-bottom:3vh;transition:opacity .45s,transform .45s;overflow-y:auto}
#home>.eye{margin-top:auto}#home>.cards{margin-bottom:auto}
#home.out{opacity:0;transform:translateY(-16px);pointer-events:none}
.eye{margin:0 0 10px;color:var(--muted);font-size:1rem;opacity:0;animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
.hi em{color:var(--accent)}
.hi{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,8vw,3.4rem);margin:0 0 6px;letter-spacing:-.02em;line-height:1.1}
.hi .w{display:inline-block;opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2.4s ease-in-out 1s 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}50%{transform:rotate(8deg)}}
.sub{color:var(--muted);margin:0 0 30px;opacity:0;animation:rise .7s .5s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.card{font:inherit;color:inherit;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;opacity:0;transform:translateY(16px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s,box-shadow .25s;display:block}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.07)}
.card:active{transform:scale(.98)}
.card:focus-visible,#inp:focus-visible,#send:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card b{display:block;font-weight:500;font-size:.95rem;margin-bottom:3px}
.card span{display:block;color:var(--muted);font-size:.85rem;line-height:1.4}
.card.gone{display:none}

/* thread */
#thread{flex:1;overflow-y:auto;display:none;flex-direction:column;gap:22px;padding:14px 0 18px;scroll-behavior:smooth}
#thread.on{display:flex}
.row{display:flex;gap:12px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;opacity:0;transform:translateY(10px)}
.row.me{justify-content:flex-end}
.me .txt{background:var(--bubble);padding:10px 16px;border-radius:20px;max-width:80%}
.bot .mark{margin-top:2px}
.bot .body{flex:1;min-width:0;line-height:1.65;font-size:1.02rem}
.w2{opacity:0;animation:fade .45s ease forwards}
@keyframes fade{to{opacity:1}}
.think{color:var(--muted);background:linear-gradient(90deg,var(--muted) 30%,var(--ink) 50%,var(--muted) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 1.3s linear infinite}
@keyframes shine{from{background-position:100% 0}to{background-position:-100% 0}}
.extra{margin-top:14px;animation:rise .5s both}
.song{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:16px;max-width:340px}
.vinyl{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--accent) 0 15%,#161212 16% 100%);box-shadow:inset 0 0 0 3px #2c2424;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.song b{display:block;font-weight:500}.song small{color:var(--muted)}
.bars{display:flex;gap:3px;align-items:flex-end;height:16px;margin-left:auto}
.bars i{width:3px;background:var(--accent);border-radius:2px;animation:eq .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.2s}.bars i:nth-child(3){animation-delay:.4s}.bars i:nth-child(4){animation-delay:.1s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
.polaroid{width:min(240px,70%);background:#fff;padding:12px 12px 14px;border-radius:4px;box-shadow:0 14px 34px rgba(0,0,0,.18);transform:rotate(-3deg);animation:drop .9s cubic-bezier(.2,1.2,.3,1) both;color:#2b2724}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(10deg)}to{opacity:1;transform:rotate(-3deg)}}
.polaroid .ph{aspect-ratio:4/5;border-radius:2px;background:linear-gradient(135deg,#ffd9cf,#f6a8b8 60%,#d98aa6);display:grid;place-items:center;overflow:hidden}
.polaroid img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.polaroid .ph svg{width:44%;fill:#fff;opacity:.9}
.polaroid p{font-family:var(--serif);font-style:italic;margin:10px 0 0;text-align:center;font-size:.95rem}

/* dock */
.dock{flex:none;padding:6px 0 16px}
#next{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
#next::-webkit-scrollbar{display:none}
.pill{flex:none;font:inherit;font-size:.85rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;transition:background .2s,transform .2s,border-color .2s;animation:rise .4s both;opacity:0;transform:translateY(8px)}
.pill:hover{background:var(--hover);border-color:var(--accent);transform:translateY(-2px)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:6px 6px 6px 18px;transition:border-color .2s,box-shadow .2s}
.bar:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
#inp{flex:1;min-width:0;border:0;background:none;color:inherit;font:inherit;font-size:1rem;padding:10px 0;outline:none}
#inp::placeholder{color:var(--muted)}
#send{width:38px;height:38px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;display:grid;place-items:center;transition:transform .2s,opacity .2s}
#send:hover{transform:scale(1.08)}#send:disabled{opacity:.3;cursor:default;transform:none}
#send svg{width:16px;height:16px}
.fine{text-align:center;color:var(--muted);font-size:.75rem;margin:10px 0 0}
.heart{position:fixed;bottom:80px;pointer-events:none;color:var(--accent);animation:float 2.2s ease-out forwards;z-index:9}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.6)}to{opacity:0;transform:translateY(-260px) scale(1.3) rotate(var(--r))}}
@media (max-width:560px){
  .cards{grid-template-columns:1fr}
  .card{padding:12px 14px}
  #home{justify-content:flex-start;padding-top:5vh}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;scroll-behavior:auto!important}}

/* diary */
.diary-card{grid-column:1/-1;border-style:dashed;border-color:var(--accent)}
#diary{flex:1;min-height:0;display:none;flex-direction:column;align-items:center}
#diary.on{display:flex;animation:dIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes dIn{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;padding:6px 0;perspective:2200px}
.book{position:relative;width:min(100%,470px);height:min(100%,640px)}
.leaf{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.65,0,.25,1);filter:drop-shadow(0 16px 26px rgba(0,0,0,.2))}
.leaf.turned{transform:rotateY(-180deg);visibility:hidden;transition:transform 1.05s cubic-bezier(.65,0,.25,1),visibility 0s 1.05s}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 16px 16px 6px;overflow:hidden}
.face::before{content:"";position:absolute;inset:0 auto 0 0;width:26px;background:linear-gradient(90deg,rgba(0,0,0,.2),transparent);pointer-events:none;z-index:2}
.face.back{transform:rotateY(180deg);background:#efe6d2}
.front{background-color:#fbf6ea;background-image:linear-gradient(90deg,transparent 46px,rgba(205,90,90,.45) 46px 48px,transparent 48px),repeating-linear-gradient(#fbf6ea 0 27px,rgba(110,140,190,.28) 27px 28px)}
.cover{background:radial-gradient(circle at 30% 20%,#4a2e28,transparent 60%),linear-gradient(135deg,#3a2420,#22110d);color:#e9cf9a;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;cursor:pointer;font-family:"Caveat",cursive}
.cover::after{content:"";position:absolute;inset:16px;border:1.5px solid rgba(233,207,154,.45);border-radius:4px 10px 10px 4px;pointer-events:none}
.cover h2{margin:0;font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;line-height:1}
.cover .gold{font-family:var(--sans);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.cover .tap{font-size:1.3rem;margin-top:18px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.pg{padding:28px 20px 16px 62px;display:flex;flex-direction:column;overflow-y:auto;color:#3b2f2a;font-family:"Caveat",cursive}
.pg>*{flex-shrink:0}
.pg .top{position:relative}
.pg .vin{position:absolute;right:0;top:3px}
.pg .num{font-size:1.05rem;color:#a2766a}
.pg h2{margin:0;font-size:2.2rem;font-weight:700;line-height:56px;padding-right:62px;white-space:nowrap}
.pg .film{font-size:1.05rem;color:#8b5e55;line-height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg p{margin:0;font-size:1.24rem;line-height:28px}
.vin{width:50px;height:50px;border-radius:50%;flex:none;background:radial-gradient(circle,#c4455e 0 16%,#1b1210 17% 100%);box-shadow:inset 0 0 0 3px #2d1f1a;animation:spin 3s linear infinite;animation-play-state:paused}
.playing .vin{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.pl{margin-top:auto;padding-top:12px;font-family:var(--sans)}
.rng{width:100%;accent-color:#c4455e;margin:0;cursor:pointer}
.tm{display:flex;justify-content:space-between;font-size:.75rem;color:#8b7a70;margin-top:2px}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:8px}
.pbtn{width:48px;height:48px;border-radius:50%;border:0;background:#3b2f2a;color:#fbf6ea;display:grid;place-items:center;cursor:pointer;transition:transform .2s,background .2s}
.pbtn:hover{transform:scale(1.08);background:#c4455e}
.sk{width:38px;height:38px;border-radius:50%;background:none;border:1px solid #b59a8f;color:#6b4f46;font:inherit;font-size:.72rem;cursor:pointer;transition:background .2s}
.sk:hover{background:#efe6d2}
.pbtn:focus-visible,.sk:focus-visible,.rng:focus-visible{outline:2px solid #c4455e;outline-offset:2px}
.dnav{flex:none;display:flex;align-items:center;gap:18px;padding:8px 0 16px;color:var(--muted);font-size:.9rem}
.dnav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:1.1rem;cursor:pointer;transition:transform .2s,border-color .2s,opacity .2s}
.dnav button:hover:not(:disabled){transform:scale(1.1);border-color:var(--accent)}
.dnav button:disabled{opacity:.3;cursor:default}
.dnav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){.pg{padding:28px 14px 12px 54px}.pg h2{font-size:1.9rem}.pg p{font-size:1.15rem}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="mark"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2.1 0 3.3 1.1 4 2.3h4c.7-1.2 1.9-2.3 4-2.3 3.4 0 5.1 3.4 3.6 6.8C19.500 16.400 12 21 12 21z" transform="translate(0 -1)"/></svg></span>Ask Chirag about you</div>

    </div>
    <p class="fine">Not an AI. Just me, pre-recorded.</p>
  </div>
</div>

const STATUS = ["Looking into my heart…","Finding the right words…","Pretending to be cool about it…","Almost there…"];
const THINK_MS = 2000;
/* ============================================================ */

const $ = id => document.getElementById(id);
const home=$("home"), thread=$("thread"), cards=$("cards"), next=$("next"), inp=$("inp"), send=$("send"), reset=$("reset");
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-8.800C1.700 8 3.300 5 6.400 5c2 0 3.200 1 3.600 2.200h4C14.400 6 15.600 5 17.600 5 20.700 5 22.300 8 21 11.200 19 15.600 12 20 12 20z"/></svg>';
let busy=false, used=new Set(), fb=0, started=false;

/* greeting */
$("hi").innerHTML = ["Ask","Chirag","about","<em>you</em>"].map((w,i)=>`<span class="w" style="animation-delay:${.15+i*.12}s">${w}</span>`).join(" ");

/* cards */
QA.forEach((x,i)=>{
  const b=document.createElement("button"); b.type="button"; b.className="card"; b.style.animationDelay=(.45+i*.08)+"s";
  b.innerHTML=`<b>${x.t}</b><span>${x.s}</span>`; b.onclick=()=>ask(i); b.id="card"+i; cards.appendChild(b);
});

function renderNext(){
  next.innerHTML="";
  { const d=document.createElement("button"); d.type="button"; d.className="pill"; d.textContent="📖 View your diary"; d.onclick=openDiary; next.appendChild(d); }
  QA.forEach((x,i)=>{ if(used.has(i)) return;
    const p=document.createElement("button"); p.type="button"; p.className="pill"; p.textContent=x.t;
    p.style.animationDelay=(i*.05)+"s"; p.onclick=()=>ask(i); next.appendChild(p); });
}
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function scroll(){thread.scrollTop=thread.scrollHeight}
function start(){
  if(started) return; started=true; next.style.display="";
  home.classList.add("out"); reset.classList.add("on");
  setTimeout(()=>{home.style.display="none"; thread.classList.add("on"); scroll();},420);
}
function userRow(text){
  const r=document.createElement("div"); r.className="row me"; r.innerHTML=`<div class="txt">${esc(text)}</div>`; thread.appendChild(r); scroll();
}
function botRow(){
  const r=document.createElement("div"); r.className="row bot";
  r.innerHTML=`<span class="mark">${HEART}</span><div class="body"><span class="think">${STATUS[0]}</span></div>`;
  thread.appendChild(r); scroll(); return r.querySelector(".body");
}
function stream(body,text,done){
  body.innerHTML=""; const words=text.split(" "); let i=0;
  const iv=setInterval(()=>{
    const s=document.createElement("span"); s.className="w2"; s.textContent=(i?" ":"")+words[i]; body.appendChild(s); scroll();
    if(++i>=words.length){clearInterval(iv); done&&done();}
  },55);
}
function respond(userText,answer,item,idx){
  if(busy) return; busy=true; start();
  userRow(userText);
  setTimeout(()=>{
    const body=botRow(), th=body.firstChild; let k=0;
    const rot=setInterval(()=>{th.textContent=STATUS[++k%STATUS.length]},600);
    setTimeout(()=>{
      clearInterval(rot);
      stream(body,answer,()=>{
        if(item&&item.song){ const e=document.createElement("div"); e.className="extra";
          e.innerHTML=`<div class="song"><div class="vinyl"></div><div><b>${esc(item.song.title)}</b><small>${esc(item.song.artist)}</small></div><div class="bars"><i></i><i></i><i></i><i></i></div></div>`; body.appendChild(e); }
        if(item&&item.photo){ const e=document.createElement("div"); e.className="extra";
          const inner=PHOTO_SRC?`<img src="${PHOTO_SRC}" alt="Favourite picture">`:`<svg viewBox="0 0 24 24">${HEART.replace(/<\/?svg[^>]*>/g,"")}</svg>`;
          e.innerHTML=`<div class="polaroid"><div class="ph">${inner}</div><p>${esc(item.photo)}</p></div>`; body.appendChild(e); }
        if(item&&item.hearts) burst();
        scroll(); busy=false; renderNext();
        if(idx!==undefined && used.size===QA.length){ const r=document.createElement("div"); r.className="row bot"; r.style.paddingLeft="38px"; r.innerHTML='<span style="color:var(--muted);font-size:.9rem">That’s everything I know. Go tell him he did good.</span>'; thread.appendChild(r); scroll(); }
      });
    },THINK_MS);
  },350);
}
function ask(i){ if(busy) return; used.add(i); const c=$("card"+i); c&&c.classList.add("gone"); respond(QA[i].t,QA[i].a,QA[i],i); }
function free(){
  const v=inp.value.trim(); if(!v||busy) return; inp.value=""; send.disabled=true;
  respond(v,FALLBACKS[fb++%FALLBACKS.length],null);
}
function burst(){
  for(let i=0;i<14;i++){ const h=document.createElement("span"); h.className="heart"; h.textContent="♥";
    h.style.left=(10+Math.random()*80)+"vw"; h.style.fontSize=(14+Math.random()*20)+"px"; h.style.setProperty("--r",(Math.random()*60-30)+"deg"); h.style.animationDelay=(Math.random()*.9)+"s";
    document.body.appendChild(h); setTimeout(()=>h.remove(),3400); }
}
inp.addEventListener("input",()=>send.disabled=!inp.value.trim());
inp.addEventListener("keydown",e=>{if(e.key==="Enter")free()});
send.onclick=free;
reset.onclick=()=>{ if(busy) return; closeDiary(); used.clear(); started=false; thread.innerHTML=""; thread.classList.remove("on"); next.innerHTML=""; next.style.display="none";
  home.style.display=""; requestAnimationFrame(()=>home.classList.remove("out")); reset.classList.remove("on");
  cards.querySelectorAll(".card").forEach(c=>c.classList.remove("gone")); };

/* ============================================= */
const diary=$("diary"), book=$("book"), dpg=$("dpg"), dprev=$("dprev"), dnext=$("dnext"), dockEl=document.querySelector(".dock");
const PLAY='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE='<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
const N=SONGS.length, leaves=[], au=new Audio();
au.preload="metadata";
let diaryOn=false, dcur=0, loaded=-1, blobTried=false;
const fmt=x=>{x=Math.max(0,Math.floor(x||0));return Math.floor(x/60)+":"+String(x%60).padStart(2,"0")};

function buildDiary(){
  const c=document.createElement("div"); c.className="leaf"; c.style.zIndex=N+1;
  c.innerHTML='<div class="face cover"><span class="gold">Private</span><h2>Chirag’s Diary</h2><span class="gold">not for anyone · except you</span><span class="tap">tap to open ♥</span></div><div class="face back"></div>';
  c.addEventListener("click",()=>{ if(dcur===0) go(1); });
  book.appendChild(c); leaves.push(c);
  SONGS.forEach((x,k)=>{
    const i=k+1, l=document.createElement("div"); l.className="leaf"; l.style.zIndex=N-k;
    l.innerHTML=`<div class="face front pg"><div class="top"><div><h2>${x.t}</h2><div class="film">from ${x.f}${x.y?" ("+x.y+")":""}</div><div class="film">${x.a}</div></div><div class="vin"></div></div><p>${x.p}</p><div class="pl"><input class="rng" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="tm"><span class="cu">0:00</span><span class="du">${fmt(x.d)}</span></div><div class="ctrl"><button class="sk bk" type="button" aria-label="Back 10 seconds">−10</button><button class="pbtn" type="button" aria-label="Play or pause">${PLAY}</button><button class="sk fw" type="button" aria-label="Forward 10 seconds">+10</button></div></div></div><div class="face back"></div>`;
    l.querySelector(".pbtn").onclick=()=>toggle(i);
    l.querySelector(".rng").oninput=e=>seekFrac(i,e.target.value/1000);
    l.querySelector(".bk").onclick=()=>skip(i,-10);
    l.querySelector(".fw").onclick=()=>skip(i,10);
    book.appendChild(l); leaves.push(l);
  });
  dprev.onclick=()=>go(dcur-1); dnext.onclick=()=>go(dcur+1); go(0,true);
}
function toBlobUrl(uri){ const b=atob(uri.split(",")[1]), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i); return URL.createObjectURL(new Blob([u],{type:"audio/mpeg"})); }
au.onerror=()=>{ if(!blobTried&&loaded>0&&AUDIO[loaded-1].indexOf("data:")===0){ blobTried=true; au.src=toBlobUrl(AUDIO[loaded-1]); au.play().catch(()=>{}); } };
function ensure(i){ if(loaded!==i){ blobTried=false; au.src=AUDIO[i-1]; loaded=i; } }
function whenReady(fn){ au.readyState>=1?fn():au.addEventListener("loadedmetadata",fn,{once:true}); }
function toggle(i){ if(loaded!==i||au.paused){ ensure(i); au.play().catch(()=>{}); } else au.pause(); }
function seekFrac(i,f){ ensure(i); whenReady(()=>{ au.currentTime=f*(au.duration||SONGS[i-1].d); upd(); }); }
function skip(i,dt){ ensure(i); whenReady(()=>{ au.currentTime=Math.min(Math.max(0,au.currentTime+dt),au.duration||1e9); upd(); }); }
function upd(){
  const l=leaves[loaded]; if(!l||loaded<1) return;
  const d=au.duration||SONGS[loaded-1].d, r=l.querySelector(".rng");
  r.value=Math.round(au.currentTime/d*1000);
  l.querySelector(".cu").textContent=fmt(au.currentTime); l.querySelector(".du").textContent=fmt(d);
  const on=!au.paused; l.querySelector(".pbtn").innerHTML=on?PAUSE:PLAY; l.classList.toggle("playing",on);
}
au.ontimeupdate=upd; au.onplay=upd; au.onpause=upd; au.onended=()=>{ au.currentTime=0; upd(); };
function resetUI(){ leaves.forEach((l,k)=>{ if(k<1) return; l.querySelector(".rng").value=0; l.querySelector(".cu").textContent="0:00"; l.querySelector(".pbtn").innerHTML=PLAY; l.classList.remove("playing"); }); }
function go(k,silent){
  k=Math.max(0,Math.min(N,k)); if(k===dcur&&!silent) return;
  au.pause(); loaded=-1; au.removeAttribute("src"); resetUI();
  dcur=k; leaves.forEach((l,j)=>l.classList.toggle("turned",j<k));
  dpg.textContent=k===0?"Cover":"Page "+k+" of "+N; dprev.disabled=k===0; dnext.disabled=k===N;
  if(k>=1&&!silent){ ensure(k); au.play().catch(()=>{}); }
}
function openDiary(){
  if(busy||diaryOn) return; diaryOn=true; started=true; reset.classList.add("on");
  home.classList.add("out"); thread.classList.remove("on"); dockEl.style.display="none";
  setTimeout(()=>{ home.style.display="none"; diary.classList.add("on"); },420);
}
function closeDiary(){
  if(!diaryOn) return; diaryOn=false; au.pause(); loaded=-1; au.removeAttribute("src"); resetUI();
  leaves.forEach(l=>{ l.style.transition="none"; l.classList.remove("turned"); }); void book.offsetWidth; leaves.forEach(l=>l.style.transition="");
  dcur=0; dpg.textContent="Cover"; dprev.disabled=true; dnext.disabled=false;
  diary.classList.remove("on"); dockEl.style.display="";
}
document.addEventListener("keydown",e=>{ if(!diaryOn||e.target.tagName==="INPUT") return; if(e.key==="ArrowRight") go(dcur+1); if(e.key==="ArrowLeft") go(dcur-1); });
let sx=null;
diary.addEventListener("touchstart",e=>{ sx=e.target.closest(".rng")?null:e.touches[0].clientX; },{passive:true});
diary.addEventListener("touchend",e=>{ if(sx===null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60) go(dcur+(dx<0?1:-1)); });
{ const dc=document.createElement("button"); dc.type="button"; dc.className="card diary-card"; dc.style.animationDelay=".4s";
  dc.innerHTML="<b>📖 View your diary</b><span>Pages you never show anyone</span>"; dc.onclick=openDiary; cards.insertBefore(dc,cards.firstChild); }
buildDiary();
next.style.display="none";
</script>
<script>var AUDIO=["song1.mp3","song2.mp3","song3.mp3","song4.mp3","song5.mp3"];</script>
</body>
</html>
